<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>しろのす</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== フォント読み込み ===== */
    @font-face {
      font-family: "ShiroNoSu";
      src: url("assets/fonts/shironosu.otf") format("opentype");
    }

    /* ===== 全体 ===== */
    body {
      margin: 0;
      height: 100vh;
      font-family: "ShiroNoSu", serif;
      background-image: url("assets/images/home-bg.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      color: #777;
    }

    /* ===== 中央配置 ===== */
    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    a {
      text-decoration: none;
      color: #777;
    }

    a:active {
      opacity: 0.6; /* タップ時の反応 */
    }

    /* ===== 個別配置（画像準拠） ===== */
    .title {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      letter-spacing: 0.2em;
    }

    .diary {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
    }

    .white {
      position: absolute;
      top: 63%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
    }

    .question {
      position: absolute;
      top: 72%;
      left: 60%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }

    .about {
      position: absolute;
      top: 78%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="title">しろのす</div>

    <div class="diary">
      <a href="diary/">にっき</a>
    </div>

    <div class="white">
      <a href="white-ritsu/">白律ろーと局</a>
    </div>

    <div class="question">
      <a href="question/">質疑妹答</a>
    </div>

    <div class="about">
      <a href="about/">ここについて</a>
    </div>

  </div>
</body>
</html>
