<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>しろのす</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== フォント読み込み ===== */
    @font-face {
      font-family: "ShiroNoSu";
      src: url("assets/fonts/HannariMincho-Regular.otf") format("opentype");
    }

    /* ===== 全体 ===== */
    body {
      margin: 0;
      height: 100vh;
      font-family: "ShiroNoSu", serif;
      background-image: url("assets/images/home-bg.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      color: #777;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    a {
      text-decoration: none;
      color: #777;
    }

    a:active {
      opacity: 0.6;
    }

    /* ===== フェード制御 ===== */
    .fade {
      transition: opacity 2s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== 配置 ===== */
    .title {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      letter-spacing: 0.2em;
    }

    .diary {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
    }

    .white {
      position: absolute;
      top: 63%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
    }

    .question {
      position: absolute;
      top: 72%;
      left: 60%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }

    .about {
      position: absolute;
      top: 78%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- タイトル -->
    <div class="title fade visible" id="title">しろのす</div>

    <!-- メニュー -->
    <div class="menu fade hidden" id="menu">
      <div class="diary"><a href="diary/">にっき</a></div>
      <div class="white"><a href="white-ritsu/">白律ろーと局</a></div>
      <div class="question"><a href="question/">質疑妹答</a></div>
      <div class="about"><a href="about/">ここについて</a></div>
    </div>

  </div>

  <script>
    let activated = false;

    document.body.addEventListener("click", () => {
      if (activated) return;
      activated = true;

      const title = document.getElementById("title");
      const menu = document.getElementById("menu");

      // タイトルをフェードアウト
      title.classList.remove("visible");
      title.classList.add("hidden");

      // 少し待ってからメニューをフェードイン
      setTimeout(() => {
        menu.classList.remove("hidden");
        menu.classList.add("visible");
      }, 2000);
    });
  </script>
</body>
</html>
