<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>しろのす</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== フォント読み込み ===== */
    @font-face {
      font-family: "ShiroNoSu";
      src: url("assets/fonts/HannariMincho-Regular.otf") format("opentype");
    }

    /* ===== 全体 ===== */
    body {
      margin: 0;
      height: 100vh;
      font-family: "ShiroNoSu", serif;
      background-image: url("assets/images/home-bg.png");
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      color: #777;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    a {
      text-decoration: none;
      color: #777;
    }

    a:active {
      opacity: 0.6;
    }

    /* ===== フェード制御 ===== */
    .fade {
      transition: opacity 2s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== 配置（調整版） ===== */
    .title {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      letter-spacing: 0.25em;
    }

    /* メイン：にっき */
    .diary {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
    }

    /* サブ：白律ろーと局 */
    .white {
      position: absolute;
      top: 63%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
    }

    /* 右寄り：質疑妹答 */
    .question {
      position: absolute;
      top: 72%;
      left: 60%;
      transform: translate(-50%, -50%);
      font-size: 17px;
    }

    /* かなり控えめ */
    .about {
      position: absolute;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
    }

    /* ===== 墨っぽい滲み演出 ===== */
    .ink-out {
      opacity: 0;
      filter: blur(7px);
      transform: translate(-50%, -50%) scale(1.06);
      transition: opacity 2s ease, filter 2s ease, transform 2s ease;
    }

    .menu.visible {
      animation: inkFadeIn 2.5s ease forwards;
    }

    @keyframes inkFadeIn {
      0% {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(6px);
      }
      60% {
        opacity: 0.6;
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- タイトル -->
    <div class="title fade visible" id="title">しろのす</div>

    <!-- メニュー -->
    <div class="menu fade hidden" id="menu">
      <div class="diary"><a href="diary/">にっき</a></div>
      <div class="white"><a href="white-ritsu/">白律ろーと局</a></div>
      <div class="question"><a href="question/">質疑妹答</a></div>
      <div class="about"><a href="about/">ここについて</a></div>
    </div>

  </div>

  <script>
    let activated = false;

    document.body.addEventListener("click", () => {
      if (activated) return;
      activated = true;

      const title = document.getElementById("title");
      const menu = document.getElementById("menu");

      // 墨が滲むようにタイトルを消す
      title.classList.add("ink-out");

      // 余韻のあと、メニューを浮かび上がらせる
      setTimeout(() => {
        title.style.display = "none";
        menu.classList.remove("hidden");
        menu.classList.add("visible");
      }, 2000);
    });
  </script>
</body>
</html>
