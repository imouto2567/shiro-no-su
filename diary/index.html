<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日記</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #f2f2f2;
  font-family: "Hiragino Mincho ProN", serif;
  color: #777;
}

/* 全体コンテナ */
.year-container {
  text-align: center;
  padding: 12vh 5vw;
  max-width: 700px;
  margin: 0 auto;
}

/* 年・月・記事タイトル */
.year {
  font-size: 4vh;
  margin: 2.5vh 0;
  cursor: pointer;
  transition: opacity 0.4s ease;
}

.year:hover {
  opacity: 0.5;
}

/* 記事タイトル（本文ページ用） */
.post-title {
  font-size: 3.2vh;
  margin-bottom: 5vh;
}

/* 本文 */
.post-content {
  font-size: 2.1vh;
  line-height: 1.9;
  text-align: left;
  white-space: normal;
}

/* 戻るボタン */
.back-button {
  margin-top: 6vh;
  font-size: 2.5vh;
  cursor: pointer;
  transition: opacity 0.4s ease;
}

.back-button:hover {
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="year-container" id="yearContainer"></div>

<script>
fetch("posts.json")
  .then(response => response.json())
  .then(posts => {

    const container = document.getElementById("yearContainer");

    function showYears() {
      container.innerHTML = "";

      const years = [...new Set(
        posts.map(post => post.date.split("-")[0])
      )];

      years.sort((a,b)=>b-a);

      years.forEach(year => {
        const div = document.createElement("div");
        div.className = "year";
        div.textContent = year + "年";
        div.onclick = () => showMonths(year);
        container.appendChild(div);
      });
    }

    function showMonths(year) {
      container.innerHTML = "";

      const months = [...new Set(
        posts
          .filter(post => post.date.startsWith(year))
          .map(post => post.date.split("-")[1])
      )];

      months.sort((a,b)=>b-a);

      months.forEach(month => {
        const div = document.createElement("div");
        div.className = "year";
        div.textContent = parseInt(month) + "月";
        div.onclick = () => showPosts(year, month);
        container.appendChild(div);
      });

      const back = document.createElement("div");
      back.className = "back-button";
      back.textContent = "← もどる";
      back.onclick = showYears;
      container.appendChild(back);
    }

    function showPosts(year, month) {
      container.innerHTML = "";

      const filtered = posts.filter(post =>
        post.date.startsWith(year + "-" + month)
      );

      filtered.sort((a,b)=> b.date.localeCompare(a.date));

      filtered.forEach(post => {
        const div = document.createElement("div");
        div.className = "year";
        div.textContent = post.title;
        div.onclick = () => showPostContent(post);
        container.appendChild(div);
      });

      const back = document.createElement("div");
      back.className = "back-button";
      back.textContent = "← もどる";
      back.onclick = () => showMonths(year);
      container.appendChild(back);
    }

    function showPostContent(post) {
      container.innerHTML = "";

      const title = document.createElement("div");
      title.className = "post-title";
      title.textContent = post.title;

      const content = document.createElement("div");
      content.className = "post-content";

      // 改行を反映
      content.innerHTML = post.content.replace(/\n/g, "<br>");

      container.appendChild(title);
      container.appendChild(content);

      const back = document.createElement("div");
      back.className = "back-button";
      back.textContent = "← もどる";
      back.onclick = showYears;
      container.appendChild(back);
    }

    showYears();
  })
  .catch(error => {
    console.error("JSON読み込みエラー:", error);
  });
</script>

</body>
</html>
