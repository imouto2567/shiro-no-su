<script>
fetch("posts.json")
  .then(response => response.json())
  .then(posts => {

    const container = document.getElementById("yearContainer");

    // 年だけ抽出（重複削除）
    const years = [...new Set(
      posts.map(post => post.date.split("-")[0])
    )];

    years.sort((a,b)=>b-a); // 新しい年を上に

    years.forEach(year => {
      const div = document.createElement("div");
      div.className = "year";
      div.textContent = year + "年";

      div.onclick = () => {
        alert(year + "年のページへ（次に作る）");
      };

      container.appendChild(div);
    });

  });
</script>
