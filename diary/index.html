<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日記</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: "Hiragino Mincho ProN", serif;
  color: #777;
}

/* 全体コンテナ */
.year-container {
  text-align: center;
  padding-top: 15vh;
  padding-bottom: 20vh;
  max-width: 700px;
  margin: 0 auto;
  background: #ffffff;
}

/* 年表示 */
.year {
  font-size: 3.1vh;
  margin: 2.4vh 0;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.year:hover {
  opacity: 0.5;
}

/* ナビ */
.nav-more {
  margin-top: 6vh;
  font-size: 2.2vh;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.nav-more:hover {
  opacity: 0.5;
}

.nav-bottom {
  margin-top: 9vh;
}

.nav-inline {
  display: inline-block;
  margin: 0 4vw;
  font-size: 2.2vh;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.nav-inline:hover {
  opacity: 0.5;
}

/* 日付 */
.post-date {
  font-size: 1.6vh;
  margin-bottom: 1.5vh;
  letter-spacing: 0.08em;
  text-align: center;
  opacity: 0.7;
}

/* 記事タイトル */
.post-title {
  font-size: 2.8vh;
  margin-bottom: 4vh;
  letter-spacing: 0.05em;
  text-align: center;
}

/* 本文 */
.post-content {
  width: 82%;
  margin: 0 auto;
  font-size: 2vh;
  line-height: 1.7;
  text-align: left;
  letter-spacing: 0.03em;
  background: #ffffff;
}

/* 画像 */
.post-image {
  display: block;
  width: 72%;
  height: auto;
  margin: 5vh auto;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* 戻る */
.back-button {
  margin-top: 6vh;
  font-size: 2.2vh;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.back-button:hover {
  opacity: 0.5;
}
</style>
</head>
<body>
<div class="year-container" id="yearContainer"></div>
<script>

/* 右クリック禁止 */
document.addEventListener("contextmenu", function(e) {
  e.preventDefault();
});

/* キーボードズーム禁止 */
document.addEventListener("keydown", function(e) {
  if ((e.ctrlKey || e.metaKey) &&
      (e.key === "+" || e.key === "-" || e.key === "=")) {
    e.preventDefault();
  }
});

fetch("posts.json")
.then(response => response.json())
.then(posts => {

  const container = document.getElementById("yearContainer");

  if (posts.length === 0) {

    container.innerHTML =
      '<div style="font-size:2vh; opacity:0.7;">まだ日記はありません。</div>';

    return;
  }

  const allYears = [...new Set(
    posts.map(post => post.date.split("-")[0])
  )].sort((a,b)=>b-a);

  const blockSize = 5;
  const yearBlocks = [];

  for (let i = 0; i < allYears.length; i += blockSize) {
    yearBlocks.push(allYears.slice(i, i + blockSize));
  }

  let currentBlockIndex = 0;

  function showYears(index = 0) {
    container.innerHTML = "";
    currentBlockIndex = index;

    const yearsToShow = yearBlocks[index] || [];

    yearsToShow.forEach(year => {
      const div = document.createElement("div");
      div.className = "year";
      div.textContent = year + "年";
      div.onclick = () => showMonths(year);
      container.appendChild(div);
    });

    createNavigation();
  }

  function createNavigation() {

    const totalBlocks = yearBlocks.length;

    if (currentBlockIndex < totalBlocks - 1) {
      const more = document.createElement("div");
      more.className = "nav-more";
      more.textContent = "もっとまえ";
      more.onclick = () => showYears(currentBlockIndex + 1);
      container.appendChild(more);
    }

    if (currentBlockIndex > 0) {

      const navBottom = document.createElement("div");
      navBottom.className = "nav-bottom";

      const recent = document.createElement("div");
      recent.className = "nav-inline";
      recent.textContent = "さいきん";
      recent.onclick = () => showYears(currentBlockIndex - 1);

      const now = document.createElement("div");
      now.className = "nav-inline";
      now.textContent = "いま";
      now.onclick = () => showYears(0);

      navBottom.appendChild(recent);
      navBottom.appendChild(now);
      container.appendChild(navBottom);
    }
  }

  function showMonths(year) {
    container.innerHTML = "";

    const months = [...new Set(
      posts
        .filter(post => post.date.startsWith(year))
        .map(post => post.date.split("-")[1])
    )].sort((a,b)=>b-a);

    months.forEach(month => {
      const div = document.createElement("div");
      div.className = "year";
      div.textContent = parseInt(month) + "月";
      div.onclick = () => showPosts(year, month);
      container.appendChild(div);
    });

    const back = document.createElement("div");
    back.className = "back-button";
    back.textContent = "← もどる";
    back.onclick = () => showYears(currentBlockIndex);
    container.appendChild(back);
  }

  function showPosts(year, month) {
    container.innerHTML = "";

    const filtered = posts.filter(post =>
      post.date.startsWith(year + "-" + month)
    ).sort((a,b)=> b.date.localeCompare(a.date));

    filtered.forEach(post => {
      const div = document.createElement("div");
      div.className = "year";

      div.textContent =
        post.date.replaceAll("-", ".") +
        "　" +
        post.title;

      div.onclick = () => showPostContent(post, year, month);
      container.appendChild(div);
    });

    const back = document.createElement("div");
    back.className = "back-button";
    back.textContent = "← もどる";
    back.onclick = () => showMonths(year);
    container.appendChild(back);
  }

  function showPostContent(post, year, month) {
    container.innerHTML = "";

    /* 日付 */
    const date = document.createElement("div");
    date.className = "post-date";
    date.textContent = post.date.replaceAll("-", ".");

    container.appendChild(date);

    /* タイトル */
    const title = document.createElement("div");
    title.className = "post-title";
    title.textContent = post.title;

    container.appendChild(title);

    /* 本文 */
    const content = document.createElement("div");
    content.className = "post-content";
    content.innerHTML = post.content.replace(/\n/g, "<br>");

    container.appendChild(content);

    /* 画像 */
    if (post.images && post.images.length > 0) {

      post.images.forEach(src => {

        const img = document.createElement("img");
        img.src = src;
        img.className = "post-image";

        container.appendChild(img);

      });
    }

    /* 戻る */
    const back = document.createElement("div");
    back.className = "back-button";
    back.textContent = "← もどる";
    back.onclick = () => showPosts(year, month);

    container.appendChild(back);
  }

  showYears(0);

})
.catch(error => {
  console.error("JSON読み込みエラー:", error);
  const container = document.getElementById("yearContainer");
  container.innerHTML =
    '<div style="font-size:2vh; opacity:0.7;">まだ日記はありません。</div>';
});
</script>
</body>
</html>
