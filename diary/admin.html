<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理画面</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:"Hiragino Mincho ProN",serif;
    background:#ffffff;
    color:#777;
    max-width:700px;
    margin:0 auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    font-weight:normal;
    margin-bottom:40px;
}

label{
    display:block;
    margin-top:25px;
    margin-bottom:10px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    font-size:16px;
}

#content{
    height:300px;
    resize:vertical;
}

#images{
    height:120px;
    resize:vertical;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    font-size:18px;
    cursor:pointer;
}

pre{
    margin-top:40px;
    padding:20px;
    background:#f5f5f5;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
}

</style>
</head>
<body>

<h1>日記管理画面</h1>

<label>タイトル</label>
<input id="title">

<label>本文</label>
<textarea id="content"></textarea>

<label>画像（1行に1枚）</label>
<textarea id="images"></textarea>

<button onclick="generateJson()">
JSON生成
</button>

<button onclick="copyJson()">
コピー
</button>

<pre id="result"></pre>

<script>

function generateJson(){

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2,"0");

    const day = String(
        today.getDate()
    ).padStart(2,"0");

    const imageList =
        document.getElementById("images")
        .value
        .split("\n")
        .map(v => v.trim())
        .filter(v => v !== "");

    const data = {
        date: `${year}-${month}-${day}`,
        title: document.getElementById("title").value,
        content: document.getElementById("content").value
    };

    if(imageList.length > 0){
        data.images = imageList;
    }

    document.getElementById("result").textContent =
        JSON.stringify(data,null,2);

}

function copyJson(){

    const text =
        document.getElementById("result").textContent;

    if(!text){
        alert("先にJSONを生成してください");
        return;
    }

    navigator.clipboard.writeText(text);

    alert("コピーしました");

}

</script>

</body>
</html>
